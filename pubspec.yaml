name: untitled2
description: "SignAI - Sign Language to Speech Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  camera: ^0.11.4
  permission_handler: ^11.3.0
  flutter_tts: ^3.8.3
  hand_landmarker: ^2.2.0
  url_launcher: ^6.2.4
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/keypoint_classifier.tflite
    - assets/keypoint_classifier_label.csv
